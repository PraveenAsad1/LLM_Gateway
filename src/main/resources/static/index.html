<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Gateway Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        
        <!-- Login Screen -->
        <div id="login-screen" class="glass-panel">
            <div class="login-box">
                <h1>Gateway Portal</h1>
                <p>Authenticate to access the LLM Gateway</p>
                
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="e.g. admin or dev1" required autocomplete="off">
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="login-btn">
                        <span>Sign In</span>
                        <div class="spinner" id="login-spinner"></div>
                    </button>
                    
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen" style="display: none;">
            <header>
                <div class="brand">LLM Gateway</div>
                <div class="user-info">
                    <span id="user-role" class="role-badge">DEVELOPER</span>
                    <button id="logout-btn" class="btn-secondary">Logout</button>
                </div>
            </header>

            <div class="dashboard-grid">
                
                <!-- Chat Section -->
                <div class="glass-panel chat-section">
                    <div id="chat-history" class="chat-history">
                        <!-- Messages will appear here -->
                        <div class="message bot">
                            System: Connected to LLM Gateway. Ready to route your prompts.
                        </div>
                    </div>
                    
                    <form id="chat-form" class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Enter your prompt for Groq/Anthropic..." required autocomplete="off">
                        <button type="submit" class="btn-primary" id="chat-btn">
                            <span>Send</span>
                            <div class="spinner" id="chat-spinner"></div>
                        </button>
                    </form>
                </div>

                <!-- Analytics Section -->
                <div class="analytics-section">
                    <div class="glass-panel">
                        <div class="stat-title">Total API Requests</div>
                        <div class="stat-value" id="stat-requests">0</div>
                    </div>
                    
                    <div class="glass-panel">
                        <div class="stat-title">Total Tokens Processed</div>
                        <div class="stat-value tokens" id="stat-tokens">0</div>
                    </div>
                    
                    <div class="glass-panel">
                        <div class="stat-title">Estimated Cost</div>
                        <div class="stat-value cost" id="stat-cost">$0.0000</div>
                    </div>
                    
                    <div class="glass-panel" id="chart-panel" style="display: none;">
                        <div class="stat-title">Provider Distribution (Admin)</div>
                        <canvas id="providerChart" width="100" height="100" style="margin-top: 1rem;"></canvas>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
