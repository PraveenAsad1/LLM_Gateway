spring.application.name=llm-gateway
server.port=8081

# ── Rate limiting ──────────────────────────────────────────────────────────────
# Maximum tokens the bucket can hold (burst capacity)
gateway.ratelimit.capacity=20
# Tokens refilled per second (sustained throughput)
gateway.ratelimit.refill-per-second=5

# ── OpenAI provider ────────────────────────────────────────────────────────────
gateway.openai.api-key=${OPENAI_API_KEY:}
gateway.openai.base-url=https://api.openai.com/v1
gateway.openai.model=gpt-4o-mini
gateway.openai.timeout-seconds=30

# ── Groq provider ──────────────────────────────────────────────────────────────
gateway.groq.api-key=${GROQ_API_KEY:}
gateway.groq.base-url=https://api.groq.com/openai/v1
gateway.groq.model=qwen/qwen3.8-27b
gateway.groq.timeout-seconds=30

# ── Anthropic provider ─────────────────────────────────────────────────────────
gateway.anthropic.api-key=${ANTHROPIC_API_KEY:}
gateway.anthropic.base-url=https://api.anthropic.com/v1
gateway.anthropic.model=claude-3-haiku-20240307
gateway.anthropic.timeout-seconds=30
gateway.anthropic.version=2023-06-01

# ── Circuit Breaker ────────────────────────────────────────────────────────────
# NOTE: These default thresholds are placeholders and would need proper load-testing to tune for production.
gateway.circuitbreaker.failure-rate-threshold=50
gateway.circuitbreaker.wait-duration-in-open-state-seconds=30
gateway.circuitbreaker.sliding-window-size=10
gateway.circuitbreaker.permitted-calls-in-half-open-state=3

# ── Database ───────────────────────────────────────────────────────────────────
# NEON_DB_URL must be the JDBC-prefixed form of Neon's pooled connection
# string, e.g.:
# jdbc:postgresql://<pooled-hostname>/<dbname>?sslmode=require
# Get the base string from the Neon dashboard's "Connect" modal (use the
# POOLED host, the one containing "-pooler" — not the direct connection),
# prepend "jdbc:", and extract the username/password separately into
# NEON_DB_USER / NEON_DB_PASSWORD rather than leaving them embedded in
# the URL.
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}

# "update" is used for portfolio-project convenience; a real production
# system would use versioned migrations (Flyway/Liquibase) instead of
# letting Hibernate auto-manage schema.
spring.jpa.hibernate.ddl-auto=update

# ── Security ───────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}